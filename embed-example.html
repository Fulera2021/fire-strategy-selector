<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FIRE in India — Embed Example Demo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: #0f172a;
      color: #f8fafc;
      padding: 40px 20px;
    }
    .page-container {
      max-width: 1100px;
      margin: 0 auto;
    }
    .demo-banner {
      background: rgba(6, 182, 212, 0.1);
      border: 1px solid rgba(6, 182, 212, 0.3);
      padding: 16px 20px;
      border-radius: 12px;
      margin-bottom: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }
    .demo-banner p { font-size: 0.95rem; color: #94a3b8; }
    .demo-banner strong { color: #38bdf8; }
    .btn-return {
      background: #0284c7;
      color: #fff;
      text-decoration: none;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
    }
    .widget-frame-wrapper {
      background: #070a14;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    }
    iframe {
      width: 100%;
      height: 850px;
      border: none;
      display: block;
    }
  </style>
</head>
<body>
  <div class="page-container">
    <div class="demo-banner">
      <div>
        <p><strong>Embed Preview:</strong> This simulates how the Strategy Selector renders when embedded on your website (e.g. <code>fireinindia2021.odoo.com</code>).</p>
      </div>
      <a href="index.html" class="btn-return">View Standalone App ↗</a>
    </div>

    <div class="widget-frame-wrapper">
      <iframe src="index.html" title="FIRE in India Strategy Selector"></iframe>
    </div>
  </div>
</body>
</html>
